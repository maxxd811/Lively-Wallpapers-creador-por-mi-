<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Psych Engine → DrumHit Chart Converter | Pix3l_Creat0r</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #0d0d12;
    color: white;
    display: flex;
    justify-content: center;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 650px;
}

.card {
    background: #17171f;
    border: 1px solid #30303b;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 26px;
}

.subtitle {
    text-align: center;
    color: #999;
    margin: 10px 0 25px;
}

.option {
    margin-top: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #393945;
    font-size: 15px;
}

input,
select {
    background: #22222c;
    color: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #7777ff;
}

.drop-zone {
    border: 2px dashed #444452;
    border-radius: 12px;
    padding: 28px 15px;
    text-align: center;
    color: #aaa;
    cursor: pointer;
    transition: 0.2s;
}

.drop-zone:hover,
.drop-zone.dragover {
    border-color: #7777ff;
    background: #20202b;
}

.drop-zone strong {
    display: block;
    color: white;
    margin-bottom: 6px;
}

#fileInput {
    display: none;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 22px;
}

button {
    cursor: pointer;
    color: white;
    background: #292934;
    font-weight: bold;
}

button:hover {
    filter: brightness(1.15);
}

.convert {
    margin-top: 10px;
    background: #5656e8;
    border-color: #6666ff;
}

.status {
    margin-top: 18px;
    padding: 13px;
    background: #111117;
    border-radius: 10px;
    text-align: center;
    color: #aaa;
    line-height: 1.5;
}

.footer {
    text-align: center;
    margin-top: 18px;
    color: #777;
    font-size: 13px;
}

.footer button {
    width: auto;
    padding: 8px 14px;
    margin-top: 8px;
}

.footer a {
    display: block;
    margin-top: 10px;
    color: #aaa;
    text-decoration: none;
}

.footer a:hover {
    color: white;
}

.language-menu {
    margin-top: 10px;
}

.hidden {
    display: none;
}

@media (max-width: 500px) {

    .card {
        padding: 18px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Psych Engine → DrumHit Chart</h1>

<div class="subtitle" id="subtitle">
Convert Psych Engine charts into drum charts
</div>

<div class="option">

<label id="fileLabel">
📁 Chart
</label>

<div class="drop-zone" id="dropZone">

<strong id="dropTitle">
Drop your Psych Engine chart here
</strong>

<span id="dropText">
or click to select a JSON file
</span>

</div>

<input
type="file"
id="fileInput"
accept=".json"
>

</div>

<div class="option">

<label id="bpmLabel">
BPM
</label>

<input
type="number"
id="bpmInput"
value="120"
min="1"
step="0.01"
placeholder="120"
>

</div>

<div class="option">

<label id="kitLabel">
Drum Kit
</label>

<select id="kitSelect">

<option value="electronic_1" selected>
electronic_1
</option>

<option value="rock_1">
rock_1
</option>

</select>

</div>

<div class="option">

<label id="notesLabel">
Notes to convert
</label>

<select id="sideSelect">

<option value="player">
Player
</option>

<option value="opponent">
Opponent
</option>

<option value="both">
Both
</option>

</select>

</div>

<button
class="convert"
id="convertButton"
>
Convert Chart
</button>

<div
class="status"
id="status"
>
Waiting for a chart...
</div>

<div class="buttons">

<button id="copyButton">
Copy JSON
</button>

<button id="downloadButton">
Download JSON
</button>

</div>

<div class="footer">

<div>
Version 1.0
</div>

<button id="languageButton">
🌐 Language
</button>

<div
class="language-menu hidden"
id="languageMenu"
>

<button data-lang="en">
English
</button>

<button data-lang="es">
Español
</button>

</div>

<a
href="https://www.tiktok.com/@Pix3l_Creat0r"
target="_blank"
rel="noopener noreferrer"
>
TikTok: @Pix3l_Creat0r
</a>

</div>

</div>
</div>

<script>

const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const bpmInput = document.getElementById("bpmInput");
const kitSelect = document.getElementById("kitSelect");
const sideSelect = document.getElementById("sideSelect");
const convertButton = document.getElementById("convertButton");
const copyButton = document.getElementById("copyButton");
const downloadButton = document.getElementById("downloadButton");
const status = document.getElementById("status");
const languageButton = document.getElementById("languageButton");
const languageMenu = document.getElementById("languageMenu");

let loadedChart = null;
let generatedJSON = null;
let currentLanguage = "en";

const translations = {

en: {

subtitle: "Convert Psych Engine charts into drum charts",

fileLabel: "📁 Chart",

dropTitle: "Drop your Psych Engine chart here",

dropText: "or click to select a JSON file",

bpmLabel: "BPM",

kitLabel: "Drum Kit",

notesLabel: "Notes to convert",

player: "Player",

opponent: "Opponent",

both: "Both",

convert: "Convert Chart",

waiting: "Waiting for a chart...",

copy: "Copy JSON",

download: "Download JSON",

language: "🌐 Language",

loaded: "Chart loaded successfully",

converted: "Chart converted successfully",

noChart: "Please select a chart first.",

invalid: "Invalid JSON file.",

noNotes: "No notes were found in the chart.",

copied: "JSON copied to clipboard!",

nothing: "Convert a chart first.",

bpmDetected: "BPM detected automatically",

manualBpm: "BPM was not detected. Using manual BPM.",

invalidBpm: "Invalid BPM.",

duplicates: "Duplicate notes removed"

},

es: {

subtitle: "Convierte charts de Psych Engine en charts de batería",

fileLabel: "📁 Chart",

dropTitle: "Arrastra tu chart de Psych Engine aquí",

dropText: "o haz clic para seleccionar un archivo JSON",

bpmLabel: "BPM",

kitLabel: "Kit de batería",

notesLabel: "Notas a convertir",

player: "Jugador",

opponent: "Oponente",

both: "Ambos",

convert: "Convertir Chart",

waiting: "Esperando un chart...",

copy: "Copiar JSON",

download: "Descargar JSON",

language: "🌐 Idioma",

loaded: "Chart cargado correctamente",

converted: "Chart convertido correctamente",

noChart: "Primero selecciona un chart.",

invalid: "El archivo JSON no es válido.",

noNotes: "No se encontraron notas en el chart.",

copied: "¡JSON copiado al portapapeles!",

nothing: "Primero convierte un chart.",

bpmDetected: "BPM detectado automáticamente",

manualBpm: "No se pudo detectar el BPM. Usando el BPM manual.",

invalidBpm: "BPM inválido.",

duplicates: "Notas duplicadas eliminadas"

}

};

function applyLanguage(lang) {

currentLanguage = lang;

const t = translations[lang];

document.documentElement.lang = lang;

document.getElementById("subtitle").textContent = t.subtitle;
document.getElementById("fileLabel").textContent = t.fileLabel;
document.getElementById("dropTitle").textContent = t.dropTitle;
document.getElementById("dropText").textContent = t.dropText;
document.getElementById("bpmLabel").textContent = t.bpmLabel;
document.getElementById("kitLabel").textContent = t.kitLabel;
document.getElementById("notesLabel").textContent = t.notesLabel;

sideSelect.options[0].text = t.player;
sideSelect.options[1].text = t.opponent;
sideSelect.options[2].text = t.both;

convertButton.textContent = t.convert;
copyButton.textContent = t.copy;
downloadButton.textContent = t.download;
languageButton.textContent = t.language;

}

applyLanguage("en");

languageButton.addEventListener("click", function() {

languageMenu.classList.toggle("hidden");

});

document.querySelectorAll("[data-lang]").forEach(button => {

button.addEventListener("click", function() {

applyLanguage(this.dataset.lang);

languageMenu.classList.add("hidden");

});

});

fileInput.addEventListener("change", function() {

if (this.files.length > 0) {

loadFile(this.files[0]);

}

});

dropZone.addEventListener("click", function() {

fileInput.click();

});

dropZone.addEventListener("dragover", function(event) {

event.preventDefault();

dropZone.classList.add("dragover");

});

dropZone.addEventListener("dragleave", function() {

dropZone.classList.remove("dragover");

});

dropZone.addEventListener("drop", function(event) {

event.preventDefault();

dropZone.classList.remove("dragover");

const file = event.dataTransfer.files[0];

if (file) {

loadFile(file);

}

});

function getNotes(chart) {

if (
chart &&
Array.isArray(chart.notes)
) {

return chart.notes;

}

if (
chart &&
chart.song &&
Array.isArray(chart.song.notes)
) {

return chart.song.notes;

}

return null;

}

function loadFile(file) {

const reader = new FileReader();

reader.onload = function(event) {

try {

loadedChart = JSON.parse(event.target.result);

const notes = getNotes(loadedChart);

if (!notes) {

status.textContent =
translations[currentLanguage].noNotes;

loadedChart = null;

return;

}

const detectedBPM = detectBPM(loadedChart);

if (detectedBPM !== null) {

bpmInput.value = detectedBPM;

status.innerHTML =
"✅ " +
translations[currentLanguage].loaded +
"<br>" +
translations[currentLanguage].bpmDetected +
": <b>" +
detectedBPM +
"</b>";

} else {

status.innerHTML =
"✅ " +
translations[currentLanguage].loaded +
"<br>" +
translations[currentLanguage].manualBpm;

}

document.getElementById("dropTitle").textContent = file.name;

} catch(error) {

loadedChart = null;

status.textContent =
translations[currentLanguage].invalid;

}

};

reader.readAsText(file);

}

function detectBPM(chart) {

const possibleValues = [

chart.bpm,

chart.songBpm,

chart.song?.bpm,

chart.song?.songBpm,

chart.song?.song?.bpm,

chart.meta?.bpm

];

for (const value of possibleValues) {

const bpm = Number(value);

if (
Number.isFinite(bpm) &&
bpm > 0
) {

return bpm;

}

}

const notes = getNotes(chart);

if (
Array.isArray(notes) &&
notes.length > 0
) {

for (const section of notes) {

if (!section) continue;

const bpm = Number(section.bpm);

if (
Number.isFinite(bpm) &&
bpm > 0
) {

return bpm;

}

}

}

if (
Array.isArray(chart.bpmChanges) &&
chart.bpmChanges.length > 0
) {

const bpm =
Number(chart.bpmChanges[0].bpm);

if (
Number.isFinite(bpm) &&
bpm > 0
) {

return bpm;

}

}

if (
Array.isArray(chart.song?.bpmChanges) &&
chart.song.bpmChanges.length > 0
) {

const bpm =
Number(chart.song.bpmChanges[0].bpm);

if (
Number.isFinite(bpm) &&
bpm > 0
) {

return bpm;

}

}

return null;

}

convertButton.addEventListener("click", function() {

if (!loadedChart) {

status.textContent =
translations[currentLanguage].noChart;

return;

}

const bpm = Number(bpmInput.value);

if (
!Number.isFinite(bpm) ||
bpm <= 0
) {

status.textContent =
translations[currentLanguage].invalidBpm;

return;

}

const sections = getNotes(loadedChart);

if (!sections) {

status.textContent =
translations[currentLanguage].noNotes;

return;

}

const output = {

version: 1,

base_bpm: bpm,

guide: "quarter",

beats_per_bar: 4,

beat_unit: 4,

lane_count: 4,

kit: kitSelect.value,

vol_click: 0,

vol_sfx: 0,

vol_bgm: 1.0,

notes: [],

bpms: [

{

time: 0.0,

bpm: bpm

}

],

bgm: 0.0

};

let converted = 0;
let duplicatesRemoved = 0;

const uniqueNotes = new Set();

for (const section of sections) {

if (
!section ||
!Array.isArray(section.sectionNotes)
) {

continue;

}

for (const note of section.sectionNotes) {

if (!Array.isArray(note)) continue;

const strumTime = Number(note[0]);
const noteData = Number(note[1]);

if (
!Number.isFinite(strumTime) ||
!Number.isFinite(noteData)
) {

continue;

}

let isPlayer;

if (noteData >= 4) {

isPlayer = true;

} else {

isPlayer = false;

}

if (section.mustHitSection === true) {

isPlayer = !isPlayer;

}

const selectedSide = sideSelect.value;

let shouldConvert = false;

if (selectedSide === "both") {

shouldConvert = true;

} else if (
selectedSide === "player" &&
isPlayer
) {

shouldConvert = true;

} else if (
selectedSide === "opponent" &&
!isPlayer
) {

shouldConvert = true;

}

if (!shouldConvert) continue;

const lane =
((noteData % 4) + 4) % 4;

const time =
Number(
(strumTime / 1000).toFixed(6)
);

const duplicateKey =
time + "|" + lane;

if (
selectedSide === "both" &&
uniqueNotes.has(duplicateKey)
) {

duplicatesRemoved++;

continue;

}

uniqueNotes.add(duplicateKey);

output.notes.push({

t: time,

l: lane,

s: "kick"

});

converted++;

}

}

output.notes.sort(function(a, b) {

if (a.t !== b.t) {

return a.t - b.t;

}

return a.l - b.l;

});

generatedJSON =
JSON.stringify(
output,
null,
2
);

let extraText = "";

if (
sideSelect.value === "both" &&
duplicatesRemoved > 0
) {

extraText =
"<br>" +
translations[currentLanguage].duplicates +
": <b>" +
duplicatesRemoved +
"</b>";

}

status.innerHTML =
"✅ " +
translations[currentLanguage].converted +
"<br>" +
"Notes: <b>" +
converted +
"</b><br>" +
"BPM: <b>" +
bpm +
"</b><br>" +
"Kit: <b>" +
kitSelect.value +
"</b>" +
extraText;

});

copyButton.addEventListener("click", async function() {

if (!generatedJSON) {

status.textContent =
translations[currentLanguage].nothing;

return;

}

try {

await navigator.clipboard.writeText(
generatedJSON
);

status.textContent =
"✅ " +
translations[currentLanguage].copied;

} catch(error) {

const textarea =
document.createElement("textarea");

textarea.value = generatedJSON;

document.body.appendChild(textarea);

textarea.select();

document.execCommand("copy");

document.body.removeChild(textarea);

status.textContent =
"✅ " +
translations[currentLanguage].copied;

}

});

downloadButton.addEventListener("click", function() {

if (!generatedJSON) {

status.textContent =
translations[currentLanguage].nothing;

return;

}

const blob =
new Blob(
[
generatedJSON
],
{
type: "application/json"
}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href = url;

link.download = "chart.json";

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

setTimeout(function() {

URL.revokeObjectURL(url);

}, 1000);

});

</script>

</body>
</html>
