function setStatus(type, data = {}) {

    statusState = {
        type: type,
        data: data
    };

    renderStatus();

}


function renderStatus() {

    const t = translations[currentLanguage];
    const data = statusState.data;

    switch (statusState.type) {

        case "waiting":

            status.innerHTML = t.waiting;

            break;


        case "loaded":

            const typeMessage =
                data.chartType === "vslice"
                    ? t.detectedVSlice
                    : t.detectedPsych;

            status.innerHTML =
                "✅ " +
                t.loaded +
                "<br>" +
                typeMessage;

            if (data.bpm !== null) {

                status.innerHTML +=
                    "<br>" +
                    t.bpmDetected +
                    ": <b>" +
                    data.bpm +
                    "</b>";

            } else {

                const bpmHelp =
                    data.chartType === "vslice"
                        ? t.bpmHelpVSlice
                        : t.bpmHelpPsych;

                status.innerHTML +=
                    "<br>" +
                    t.manualBpm +
                    "<br><br>" +
                    bpmHelp;

            }

            break;


        case "unknown":

            status.innerHTML =
                "⚠️ " +
                t.unknownType;

            break;


        case "invalid":

            status.innerHTML =
                "❌ " +
                t.invalid;

            break;


        case "noChart":

            status.innerHTML =
                t.noChart;

            break;


        case "noNotes":

            status.innerHTML =
                t.noNotes;

            break;


        case "noDifficulty":

            status.innerHTML =
                t.noDifficulty;

            break;


        case "invalidBpm":

            status.innerHTML =
                t.invalidBpm;

            break;


        case "nothing":

            status.innerHTML =
                t.nothing;

            break;


        case "copied":

            status.innerHTML =
                "✅ " +
                t.copied;

            break;


        case "converted":

            let typeText =
                data.chartType === "vslice"
                    ? "V-Slice"
                    : "Psych Engine";

            let difficultyText = "";

            if (data.chartType === "vslice") {

                difficultyText =
                    "<br>" +
                    t.difficultyLabel +
                    ": <b>" +
                    data.difficulty +
                    "</b>";

            }

            let extraText = "";

            if (
                data.side === "both" &&
                data.duplicatesRemoved > 0
            ) {

                extraText =
                    "<br>" +
                    t.duplicates +
                    ": <b>" +
                    data.duplicatesRemoved +
                    "</b>";

            }

            status.innerHTML =
                "✅ " +
                t.converted +
                "<br>" +

                typeText +
                "</b>" +
                difficultyText +

                data.bpm +
                "</b><br>" +
                "Kit: <b>electronic_1</b>" +
                extraText;

            break;

    }

}

    chartTypeSelect.options[1].text =

    sideSelect.options[0].text =

    languageButton.textContent =

    if (loadedChart) {

    /*
        MUY IMPORTANTE:
        Se vuelve a mostrar el mensaje actual
        usando el nuevo idioma.
    */

applyLanguage("en");


languageButton.addEventListener("click", function() {

    languageMenu.classList.toggle("hidden");

});


document.querySelectorAll("[data-lang]").forEach(button => {

        languageMenu.classList.add("hidden");

});


/* =========================================================
   ARCHIVOS
========================================================= */

fileInput.addEventListener("change", function() {

    if (this.files.length > 0) {
        loadFile(this.files[0]);
    }

});


dropZone.addEventListener("click", function() {

    fileInput.click();

});


dropZone.addEventListener("dragover", function(event) {

    event.preventDefault();

    dropZone.classList.add("dragover");

});


dropZone.addEventListener("dragleave", function() {

    dropZone.classList.remove("dragover");

});


dropZone.addEventListener("drop", function(event) {

    event.preventDefault();

    dropZone.classList.remove("dragover");

    const file = event.dataTransfer.files[0];

    if (file) {
        loadFile(file);
    }

});


/* =========================================================
   TIPO DE CHART
========================================================= */

chartTypeSelect.addEventListener("change", function() {

    if (!loadedChart) {
        return;
    }

    updateChartTypeInterface();

});


function detectChartType(chart) {

    if (!chart || typeof chart !== "object") {
        return null;
    }


    /*
        PSYCH ENGINE
    */

    if (
        Array.isArray(chart.notes) ||
        (
            chart.song &&
            Array.isArray(chart.song.notes)
        )
    ) {

        return "psych";

    }


    /*
        V-SLICE
    */

    if (
        chart.notes &&
        typeof chart.notes === "object" &&
        !Array.isArray(chart.notes)
    ) {

        const keys =
            Object.keys(chart.notes);

        if (
            keys.some(key =>
                ["easy", "normal", "hard"]
                .includes(key.toLowerCase())
            )
        ) {

            return "vslice";

        }

    }


    if (
        chart.scrollSpeed &&
        chart.notes &&
        typeof chart.notes === "object"
    ) {

        return "vslice";

    }


    return null;

}


function getPsychNotes(chart) {

    if (
        chart &&
        Array.isArray(chart.notes)
    ) {

        return chart.notes;

    }


    if (
        chart &&
        chart.song &&
        Array.isArray(chart.song.notes)
    ) {

        return chart.song.notes;

    }


    return null;

}


function getVSliceDifficulties(chart) {

    if (
        !chart ||
        !chart.notes ||
        typeof chart.notes !== "object" ||
        Array.isArray(chart.notes)
    ) {

        return [];

    }


    return Object.keys(chart.notes)
        .filter(key =>
            Array.isArray(chart.notes[key])
        );

}


function updateDifficultyList() {

    if (!loadedChart) {
        return;
    }


    const type =
        chartTypeSelect.value === "auto"
            ? detectedChartType
            : chartTypeSelect.value;


    if (type !== "vslice") {

        difficultyOption.classList.add("hidden");

        difficultySelect.innerHTML = "";

        return;

    }


    const difficulties =
        getVSliceDifficulties(loadedChart);


    difficultySelect.innerHTML = "";


    for (const difficulty of difficulties) {

        const option =
            document.createElement("option");

        option.value = difficulty;

        option.textContent =
            difficulty.charAt(0).toUpperCase() +
            difficulty.slice(1);

        difficultySelect.appendChild(option);

    }


    if (difficulties.length > 0) {

        difficultyOption.classList.remove("hidden");

    } else {

        difficultyOption.classList.add("hidden");

    }

}


function updateChartTypeInterface() {

    const type =
        chartTypeSelect.value === "auto"
            ? detectedChartType
            : chartTypeSelect.value;


    if (type === "vslice") {

        updateDifficultyList();

    } else {

        difficultyOption.classList.add("hidden");

    }

}


function getCurrentChartType() {

    if (chartTypeSelect.value === "psych") {
        return "psych";
    }

    if (chartTypeSelect.value === "vslice") {
        return "vslice";
    }

    return detectedChartType;

}


/* =========================================================
   CARGAR CHART
========================================================= */

function loadFile(file) {

    const reader =
        new FileReader();


    reader.onload = function(event) {

        try {

            loadedChart =
                JSON.parse(event.target.result);

            detectedChartType =
                detectChartType(loadedChart);


            document.getElementById("dropTitle")
                .textContent = file.name;


            if (!detectedChartType) {

                chartTypeSelect.value = "auto";

                difficultyOption
                    .classList.add("hidden");

                setStatus("unknown");

                return;

            }


            chartTypeSelect.value =
                detectedChartType;


            updateChartTypeInterface();


            const detectedBPM =
                detectBPM(loadedChart);


            if (detectedBPM !== null) {

                bpmInput.value =
                    detectedBPM;

            }


            setStatus("loaded", {

                chartType:
                    detectedChartType,

                bpm:
                    detectedBPM

            });


        } catch(error) {

            loadedChart = null;

            detectedChartType = null;

            setStatus("invalid");

        }

    };


    reader.readAsText(file);

}


/* =========================================================
   DETECTAR BPM
========================================================= */

function detectBPM(chart) {

    const possibleValues = [

        chart.bpm,

        chart.songBpm,

        chart.song?.bpm,

        chart.song?.songBpm,

        chart.song?.song?.bpm,

        chart.meta?.bpm,

        chart.metadata?.bpm

    ];


    for (const value of possibleValues) {

        const bpm =
            Number(value);


        if (
            Number.isFinite(bpm) &&
            bpm > 0
        ) {

            return bpm;

        }

    }


    /*
        Psych Engine sections
    */

    const notes =
        getPsychNotes(chart);


    if (
        Array.isArray(notes) &&
        notes.length > 0
    ) {

        for (const section of notes) {

            if (!section) {
                continue;
            }


            const bpm =
                Number(section.bpm);


            if (
                Number.isFinite(bpm) &&
                bpm > 0
            ) {

                return bpm;

            }

        }

    }


    /*
        BPM changes
    */

    if (
        Array.isArray(chart.bpmChanges) &&
        chart.bpmChanges.length > 0
    ) {

        const bpm =
            Number(
                chart.bpmChanges[0].bpm
            );


        if (
            Number.isFinite(bpm) &&
            bpm > 0
        ) {

            return bpm;

        }

    }


    if (
        Array.isArray(chart.song?.bpmChanges) &&
        chart.song.bpmChanges.length > 0
    ) {

        const bpm =
            Number(
                chart.song.bpmChanges[0].bpm
            );


        if (
            Number.isFinite(bpm) &&
            bpm > 0
        ) {

            return bpm;

        }

    }


    return null;

}


/* =========================================================
   CONVERSIÓN PSYCH ENGINE
========================================================= */

function convertPsychChart(
    sections,
    selectedSide,
    output
) {

    let converted = 0;

    let duplicatesRemoved = 0;

    const uniqueNotes =
        new Set();


    for (const section of sections) {

        if (
            !section ||
            !Array.isArray(section.sectionNotes)
        ) {

            continue;

        }


        for (const note of section.sectionNotes) {

            if (!Array.isArray(note)) {
                continue;
            }


            const strumTime =
                Number(note[0]);

            const noteData =
                Number(note[1]);


            if (
                !Number.isFinite(strumTime) ||
                !Number.isFinite(noteData)
            ) {

                continue;

            }


            /*
                Psych Engine:

                noteData 0-3 = lado base
                noteData 4-7 = lado opuesto

                mustHitSection cambia qué lado
                corresponde al jugador.
            */

            let isPlayer =
                noteData >= 4;


            if (section.mustHitSection === true) {

                isPlayer = !isPlayer;

            }


            let shouldConvert = false;


            if (selectedSide === "both") {

                shouldConvert = true;

            } else if (
                selectedSide === "player" &&
                isPlayer
            ) {

                shouldConvert = true;

            } else if (
                selectedSide === "opponent" &&
                !isPlayer
            ) {

                shouldConvert = true;

            }


            if (!shouldConvert) {
                continue;
            }


            const lane =
                ((noteData % 4) + 4) % 4;


            const time =
                Number(
                    (strumTime / 1000)
                    .toFixed(6)
                );


            const duplicateKey =
                time + "|" + lane;


            if (
                selectedSide === "both" &&
                uniqueNotes.has(duplicateKey)
            ) {

                duplicatesRemoved++;

                continue;

            }


            uniqueNotes.add(
                duplicateKey
            );


            output.notes.push({

                t: time,

                l: lane,

                s: "kick"

            });


            converted++;

        }

    }


    return {

        converted,

        duplicatesRemoved

    };

}


/* =========================================================
   CONVERSIÓN V-SLICE
========================================================= */

function convertVSliceChart(
    notes,
    selectedSide,
    output
) {

    let converted = 0;

    let duplicatesRemoved = 0;

    const uniqueNotes =
        new Set();


    for (const note of notes) {

        if (
            !note ||
            typeof note !== "object"
        ) {

            continue;

        }


        const strumTime =
            Number(note.t);

        const noteData =
            Number(note.d);


        if (
            !Number.isFinite(strumTime) ||
            !Number.isFinite(noteData)
        ) {

            continue;

        }


        if (
            noteData < 0 ||
            noteData > 7
        ) {

            continue;

        }


        /*
            V-Slice:

            0-3 = Player
            4-7 = Opponent

            Esta es la parte corregida.
        */

        const isPlayer =
            noteData >= 0 &&
            noteData <= 3;


        const isOpponent =
            noteData >= 4 &&
            noteData <= 7;


        let shouldConvert = false;


        if (selectedSide === "both") {

            shouldConvert = true;

        } else if (
            selectedSide === "player" &&
            isPlayer
        ) {

            shouldConvert = true;

        } else if (
            selectedSide === "opponent" &&
            isOpponent
        ) {

            shouldConvert = true;

        }


        if (!shouldConvert) {
            continue;
        }


        const lane =
            ((noteData % 4) + 4) % 4;


        const time =
            Number(
                (strumTime / 1000)
                .toFixed(6)
            );


        const duplicateKey =
            time + "|" + lane;


        if (
            selectedSide === "both" &&
            uniqueNotes.has(duplicateKey)
        ) {

            duplicatesRemoved++;

            continue;

        }


        uniqueNotes.add(
            duplicateKey
        );


        output.notes.push({

            t: time,

            l: lane,

            s: "kick"

        });


        converted++;

    }


    return {

        converted,

        duplicatesRemoved

    };

}


/* =========================================================
   CONVERTIR
========================================================= */

convertButton.addEventListener(
    "click",
    function() {

        if (!loadedChart) {

            setStatus("noChart");

            return;

        }


        const bpm =
            Number(bpmInput.value);


        if (
            !Number.isFinite(bpm) ||
            bpm <= 0
        ) {

            setStatus("invalidBpm");

            return;

        }


        const chartType =
            getCurrentChartType();


        if (!chartType) {

            setStatus("unknown");

            return;

        }


        if (chartType === "vslice") {

            const difficulties =
                getVSliceDifficulties(
                    loadedChart
                );


            if (
                difficulties.length === 0
            ) {

                setStatus(
                    "noDifficulty"
                );

                return;

            }


            if (!difficultySelect.value) {

                setStatus(
                    "noDifficulty"
                );

                return;

            }

        }


        const output = {

            version: 1,

            base_bpm: bpm,

            guide: "quarter",

            beats_per_bar: 4,

            beat_unit: 4,

            lane_count: 4,

            kit: "electronic_1",

            vol_click: 0,

            vol_sfx: 0,

            vol_bgm: 1.0,

            notes: [],

            bpms: [

                {

                    time: 0.0,

                    bpm: bpm

                }

            ],

            bgm: 0.0

        };


        let result;


        if (chartType === "psych") {

            const sections =
                getPsychNotes(
                    loadedChart
                );


            if (!sections) {

                setStatus(
                    "noNotes"
                );

                return;

            }


            result =
                convertPsychChart(
                    sections,
                    sideSelect.value,
                    output
                );


        } else {

            const difficulty =
                difficultySelect.value;


            const notes =
                loadedChart
                    .notes[difficulty];


            if (
                !Array.isArray(notes)
            ) {

                setStatus(
                    "noNotes"
                );

                return;

            }


            result =
                convertVSliceChart(
                    notes,
                    sideSelect.value,
                    output
                );

        }


        output.notes.sort(
            function(a, b) {

                if (a.t !== b.t) {

                    return a.t - b.t;

                }

                return a.l - b.l;

            }
        );


        generatedJSON =
            JSON.stringify(
                output,
                null,
                2
            );


        setStatus(
            "converted",
            {

                chartType:
                    chartType,

                difficulty:
                    chartType === "vslice"
                        ? difficultySelect.value
                        : null,

                converted:
                    result.converted,

                duplicatesRemoved:
                    result.duplicatesRemoved,

                bpm:
                    bpm,

                side:
                    sideSelect.value

            }
        );

    }
);


/* =========================================================
   COPIAR
========================================================= */

copyButton.addEventListener(
    "click",
    async function() {

        if (!generatedJSON) {

            setStatus("nothing");

            return;

        }


        try {

            await navigator.clipboard
                .writeText(
                    generatedJSON
                );


            setStatus("copied");


        } catch(error) {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                generatedJSON;


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                "copy"
            );


            document.body.removeChild(
                textarea
            );


            setStatus("copied");

        }

    }
);


/* =========================================================
   DESCARGAR
========================================================= */

downloadButton.addEventListener(
    "click",
    function() {

        if (!generatedJSON) {

            setStatus("nothing");

            return;

        }


        const blob =
            new Blob(
                [
                    generatedJSON
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;

        link.download =
            "chart.json";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    }
);

</script>
